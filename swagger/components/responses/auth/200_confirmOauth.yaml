description: Successfully logged in via Google OAuth!
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully logged in via Google OAuth!
        data:
          type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              example: EXelG/M5d9DRudgt0oFOqaiV3uHRbxdz/TltoUrI
