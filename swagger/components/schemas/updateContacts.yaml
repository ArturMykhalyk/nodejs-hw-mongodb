type: object
properties:
  name:
    description: "Contact's name"
    type: string
    example: 'Artur Mykhalyk'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+380960000000'
  email:
    description: "Contact's email"
    type: string
    example: 'qwerty@email.com'
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    type: string
    format: binary
    description: Optional contact photo file
