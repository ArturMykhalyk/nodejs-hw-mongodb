type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Artur Mykhalyk'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+380960000000'
  email:
    description: "Contact's email"
    type: string
    example: 'qwerty@email.com'
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    type: string
    format: date-time
    example: '2025-02-28T12:34:56.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-03-29T12:34:56.000Z'
