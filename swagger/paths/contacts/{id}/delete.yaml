tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Delete an existing contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '64fa123abcde4567'
responses:
  '204':
    description: Successfully deleted contact
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: '../../../components/responses/contacts/404_contact.yaml'
